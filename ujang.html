<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/sytle.css" />
  </head>
 
  <body class="font-['Poppins']">
     <style>
    @keyframes Masuk {
      from{
        opacity:0;
      }
      to{
        opacity: 1;
      }
    }
    .masuk {
      animation: Masuk 2s ease-in-out;
    }
  </style>
    <div>
      <video
        id="myVideo"
        class="fixed inset-0 w-full h-full object-cover hidden z-50"
      >
        <source src="./foto/oneforall.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
      <button
        id="Back"
        class="cursor-pointer bg-transparent flex items-center hidden z-50 fixed top-5 left-5 p-2"
      >
        <img src="./foto/back.png" alt="back" class="h-8 w-8" />
      </button>
    </div>
    <div
      id="fadeOverlay"
      class="fixed inset-0 bg-black opacity-0 pointer-events-none z-40 transition-opacity duration-1000"
    ></div>
    <section class="relative h-screen bg-[url('./foto/wowok.jpeg')] ">
      <div
        class="absolute inset-0 bg-linear-to-r from-black/90 to-transparent"
      ></div>
      <div class="relative z-10">
        <img src="./foto/netflix.png" class="h-[150px] mb-5" />
      </div>
      <div>
      <div
        class="absolute inset-0 flex flex-col justify-center z-10 items-start masuk"
      >
        <h1 class="text-white text-6xl ml-12 font-semibold">OWO BOY</h1>
        <p class="mt-5 max-w-xl ml-12 text-white text-2xl">
          The journey of the foreign threat massacare has come, Owo, Strongest
          man in Indonesia trying to get rid of them with his cold hands
        </p>
        <div class="flex flex-col ml-12 mt-4">
          <div class="flex justify-start">
            <button
              id="Play"
              class="cursor-pointer transition-all font-semibold bg-white text-black text-2xl px-12 py-3 rounded-xs hover:bg-white/80 mr-2 flex items-center gap-2"
            >
              <img
                src="./foto/play-button-arrowhead.png"
                alt="play"
                class="h-6 w-6"
              />
              Play
            </button>
            <button
              class="cursor-pointer transition-all font-semibold bg-white/50 text-white text-2xl px-14 py-3 rounded-xs hover:bg-white/30 flex items-center gap-2"
              id="More"
            >
              <img src="./foto/info.png" alt="play" class="h-8 w-8" />
              More
            </button>
            
            <div
              class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white/30 backdrop-blur-none flex justify-center items-center z-40 rounded-lg p-20 max-w-lg hidden"
              id="details"
            >
              <p class="text-2xl text-center text-white">oke gas oke gas</p>
              <button
                id="closeDtl"
                class="cursor-pointer bg-transparent flex items-center z-50 fixed top-5 left-5 p-2 "
              >
                <img src="./foto/back.png" alt="back" class="h-8 w-8" />
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
  <script src="/script.js"></script>
</html>
